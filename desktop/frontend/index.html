<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes</title>
    <script>
      // Applied before the first paint so the app never flashes the wrong
      // theme on launch. App.tsx keeps this attribute in sync afterwards.
      //
      // 'system' is the default and follows the OS. It has to resolve to a
      // concrete value here rather than being left to CSS, because the rest of
      // the stylesheet keys off [data-theme] alone.
      try {
        var pref = localStorage.getItem('hermes-theme');
        if (pref !== 'light' && pref !== 'dark') {
          pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = pref;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
